
name: DevSecOps CI

on:
  push:
    branches: [devsecops-workshop]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and Test
        run: .\mvnw.cmd -B clean verify

      
            - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          .\mvnw.cmd org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          "-Dsonar.projectKey=devSecOps-workshop"
          "-Dsonar.projectName=DevSecOps-Workshop"
          "-Dsonar.host.url=http://localhost:9000"
          "-Dsonar.token=$env:SONAR_TOKEN"

